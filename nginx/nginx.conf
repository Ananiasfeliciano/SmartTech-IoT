# ============================================================
# SmartTech IoT OS — Nginx Reverse Proxy + TLS
# Item 4 — OWASP: Secure Configuration / Defense in Depth
# Instalar: sudo cp nginx/nginx.conf /etc/nginx/sites-available/smarttech
#           sudo ln -s /etc/nginx/sites-available/smarttech /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ── Rate limiting zones ────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=30r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# ── Redirect HTTP → HTTPS ──────────────────────────────────
server {
    listen 80;
    server_name smarttech-iot.example.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS server ───────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name smarttech-iot.example.com;

    # --- Certificados TLS (Let's Encrypt / Certbot) --------
    ssl_certificate     /etc/letsencrypt/live/smarttech-iot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smarttech-iot.example.com/privkey.pem;

    # --- Protocolos e cifras seguras (TLS 1.2 mínimo) ------
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # --- HSTS (6 meses) ------------------------------------
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;

    # --- Security Headers ----------------------------------
    add_header X-Frame-Options           "DENY"                          always;
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header X-XSS-Protection          "1; mode=block"                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups"     always;

    # --- Ocultar versão do Nginx ---------------------------
    server_tokens off;

    # --- Tamanho máximo de upload (10 MB) -----------------
    client_max_body_size 10m;

    # --- Timeout de conexão --------------------------------
    client_body_timeout   12s;
    client_header_timeout 12s;
    keepalive_timeout     15s;
    send_timeout          10s;

    # --- Limitar conexões simultâneas por IP ---------------
    limit_conn addr 20;

    # ── Rotas ─────────────────────────────────────────────

    # Login — rate limit estrito (5 req/min por IP)
    location /api/auth/ {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        keep-alive;
    }

    # API geral — rate limit moderado (30 req/min)
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # OAuth Google callback
    location /auth/google/callback {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA estática (dist/)
    location / {
        root /var/www/smarttech-iot/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache assets com hash (Vite gera hashes no nome do arquivo)
        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\.(env|git|htaccess|DS_Store) {
        deny all;
        return 404;
    }
}
